# ══════════════════════════════════════════════════════════════════════════
# Core Vision Perfect V1 — single config for the whole system.
# Any key can be overridden per-machine via env vars:  CVP_<SECTION>__<KEY>=...
#   e.g.  CVP_PATHS__DATA_ROOT=/content/drive/MyDrive/AIC2025/data
#         CVP_EMBEDDING__MODEL=ensemble    CVP_SEARCH__TOPK=800
# ══════════════════════════════════════════════════════════════════════════

project_name: core-vision-perfect-v1

paths:
  data_root: ./data                # AIC dataset root (merged organiser packages)
  artifacts_root: ./artifacts      # everything we build (indexes, ocr, ...)
  keyframes_dir: keyframes
  clip_features_dir: clip-features-32
  map_keyframes_dir: map-keyframes
  media_info_dir: media-info
  objects_dir: objects
  videos_dir: videos

embedding:
  # siglip2 (multilingual default) | finetuned (your trained vi tower)
  # | openclip (English lane) | qwen_embed (native-vi MLLM lane, heavy)
  # | provided_clip32 (organiser features, instant) | mclip | jina | metaclip2
  # | ensemble (fuses ensemble_members below)
  model: siglip2
  siglip2_id: google/siglip2-so400m-patch16-384
  # English lane: Meta Perception Encoder first (best open dual-encoder 2026,
  # used by MERVIN at AIC-2025), Apple DFN5B ViT-H/14-378 as the fallback.
  openclip_hub_ids:
    - "hf-hub:timm/PE-Core-bigG-14-448"
    - "hf-hub:timm/PE-Core-L-14-336"
  openclip_arch: ViT-H-14-378-quickgelu
  openclip_pretrained: dfn5b
  # Optional native-Vietnamese lane (Qwen3-VL-Embedding: best vi zero-shot R@1).
  qwen_embed_id: Qwen/Qwen3-VL-Embedding-8B   # round-80: 8B SOTA (2B chỉ khi thiếu VRAM)
  qwen_embed_dim: 1536   # MRL, 8B hỗ trợ 64-4096
  qwen_embed_instruction: "Represent this news-video keyframe / query for retrieval."
  mclip_id: M-CLIP/XLM-Roberta-Large-Vit-L-14
  mclip_image_arch: ViT-L-14
  mclip_image_pretrained: openai
  jina_id: jinaai/jina-clip-v2            # optional 89-language lane (CC-BY-NC)
  jina_dim: 1024                          # Matryoshka truncation, valid 64-1024
  metaclip2_id: facebook/metaclip-2-worldwide-huge-quickgelu  # multilingual SOTA 2026
  # Competition setting: ensemble of the Vietnamese-tuned tower + English lane.
  ensemble_members: [siglip2, openclip]
  ensemble_weights: [0.55, 0.45]
  text_max_length: 64
  device: auto        # auto | cuda | cpu
  dtype: auto         # auto | bf16 | fp16 | fp32
  batch_size: 64

finetuned:
  base_id: google/siglip2-so400m-patch16-384
  checkpoint: ./artifacts/checkpoints/vi_siglip2_best   # from the H100 notebook

index:
  type: flatip        # flatip (exact, ~1-2M vectors OK) | ivf (faster CPU) | hnsw
  ivf_nlist: 4096
  ivf_nprobe: 32
  hnsw_m: 32
  hnsw_ef_search: 128
  use_gpu: false      # true if faiss-gpu is installed (Colab)

search:
  topk: 500           # dense candidates per member before fusion
  display_k: 120      # rows surfaced to UI / submission
  rerank: true        # SuperGlobal re-ranking of each member's candidates
  fusion_method: weighted_sum   # weighted_sum (tuned, default) | rrf (untuned-safe)
  rrf_k: 60
  weights:            # signal blend (min-max normalized before weighting)
    visual: 1.0
    ocr: 0.35
    asr: 0.30
    caption: 0.25
    metadata: 0.15
    object: 0.25
  neighbor_boost: 0.10   # temporal-context smoothing strength
  neighbor_window: 2
  # ── Second-pass consistency boost (đợt 2, Nhiệm vụ C; mặc định OFF) ──
  # Cộng điểm cho ứng viên mà các frame LÂN CẬN cùng video cũng điểm cao:
  # đỉnh thật là cao nguyên (nhiều keyframe liền kề cùng sáng), nhiễu là gai
  # đơn độc (hàng xóm câm lặng → không được cộng gì). Chạy TRƯỚC neighbor_boost
  # trên fused map thô; chỉ đường KIS/QA/AVS, không đụng TRAKE. 0.0 = tắt.
  neighbor_consistency_boost: 0.0   # thử 0.10-0.20 khi bench A/B
  neighbor_consistency_window: 2    # số keyframe lân cận mỗi phía được xét
  neighbor_consistency_decay: 0.5   # phiếu hàng xóm xa giảm theo decay^d
  # ── Chiến lược 100 dòng nộp (đợt 2, Nhiệm vụ D; mặc định OFF) ──
  # legacy = đổ nguyên ranking (hành vi cũ). diversify_tail = giữ NGUYÊN VĂN
  # row_strategy_head dòng đầu, phần đuôi thay ranking loãng bằng frame lân
  # cận quanh ứng viên top của TỪNG video trong head (trung điểm giữa 2
  # keyframe trước — lưới thưa ~5-7s, cửa sổ GT ±5s — rồi keyframe kề);
  # variants chiếm tối đa NỬA đuôi, phần còn lại giữ ranking gốc.
  # Chỉ KIS/QA (AVS có MMR riêng, TRAKE có jitter riêng).
  row_strategy: legacy              # legacy | diversify_tail
  row_strategy_head: 30
  row_strategy_variants: 4
  # round-84: KIS đa cảnh — tách sự kiện + căn chỉnh DANTE rồi trộn RRF (bench-gated)
  kis_multi_event: false
  # round-86: căn chỉnh chuỗi cảnh cho bước tìm moment của QA (bench-gated)
  qa_multi_event: false
  # round-86: đa dạng hóa đầu bảng theo video (top-5 ≤2/video, top-20 ≤5/video)
  head_diversity: false
  temporal_boost: false  # Vortex before/now/after boost for "… sau khi …" queries
  temporal_boost_weight: 0.25
  temporal_boost_window: 12
  temporal_boost_topk: 200
  low_confidence_retry: false   # auto-track: reformulate+RRF-merge flat rankings
  low_confidence_threshold: 0.25
  reranker: none         # pairwise cross-encoder: none | blip2_itm | qwen_reranker
  rerank_topk: 100       # candidates the cross-encoder re-scores
  rerank_weight: 0.5     # blend: (1-w)*fused + w*cross (both min-max normalized)
  rerank_batch_size: 8
  blip2_itm_id: Salesforce/blip2-itm-vit-g
  qwen_reranker_id: Qwen/Qwen3-VL-Reranker-8B   # round-41: 80.7 vs 73.8 MMEB-v2, ~18GB BF16
  vlm_rerank: false      # listwise VLM re-rank of the top rows (needs API/GPU)
  vlm_rerank_topk: 24
  vlm_rerank_provider: gemini   # gemini | vintern | hf_auto | none
  # round-45: listwise scorer on the cheap tier (thinking minimal, media low)
  vlm_rerank_model: gemini-3.5-flash-lite
  # round-96: khi cầu dao bão mở trên mọi model Gemini (hoặc mọi phiếu rỗng),
  # chấm lại bằng VLM cục bộ (vqa.local_backend=hf_auto + vqa.local_hf_id).
  # Mọi ô "model id" Gemini (vlm_rerank_model, vqa.answer_model, query.
  # gemini_model_fallbacks) còn nhận "vertex:<id>" (Vertex express, secret
  # GEMINI_VERTEX_KEY) và "hf:<org/model[:provider]>" (HF Inference Providers,
  # secret HF_TOKEN) — lane thiếu secret tự bị bỏ khỏi chuỗi.
  vlm_rerank_local_fallback: false
  avs_mmr_lambda: 0.7    # AVS: relevance-vs-novelty trade-off (1.0 = pure relevance)
  avs_per_video_cap: 3
  avs_min_gap_s: 10.0

query:
  provider: gemini    # none | google | gemini  (degrades automatically)
  gemini_model: gemini-3.5-flash-lite   # round-45: easy text task -> Lite tier, ~1/10 cost
  # "-latest" tail: pinned retired ids 404 for new users (the old 2.5 pin
  # died that way live 20/08); the rolling alias can't retire.
  # round-89: 3.8 Flash (GA 02/09/2026, based on 3.7, same promo price) leads the rescue chain
  gemini_model_fallbacks: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-flash-latest]
  enhance: true       # rewrite the query as a concrete visual description
  enhance_english: true
  expansions: 2       # extra paraphrases for multi-query max-fusion
  multi_query_agg: max
  cache: true
  timeout_s: 15.0    # Gemini API rejects deadlines <10s (400, live 20/08) — keep ≥10

temporal:             # TRAKE
  algo: dante         # dante (O(N·T) running-max DP) | beam (diverse beam DP)
  use_ensemble: true  # score events with the full ensemble
  per_event_topk: 100
  max_gap_s: 150.0
  min_gap_s: 0.0
  sim_floor: 0.10
  beam_size: 8
  max_videos: 30
  gap_penalty_per_s: 0.0005   # DANTE-style soft gap penalty
  # Organiser TRAKE files: header line + "E1:…" events. none = drop the header
  # (safe default) | prepend = merge it into every event text (A/B knob).
  event_context: none
  # ── TRAKE-upgrade knobs (defaults = old behaviour; flip ONE per bench A/B) ──
  # original = encode chỉ text sự kiện thô; all = encode mọi biến thể Gemini đã
  # cache (original+enhanced+translation+expansions) rồi max-fuse per event.
  event_query_variants: original   # original | all
  # prepend = bước gom video tìm bằng "<header đề>. <event>" (lane đa ngôn ngữ),
  # DP vẫn chấm bằng event trần — thêm ngữ cảnh video mà không loãng mốc.
  # ĐỪNG bật cùng lúc với event_context: prepend (header sẽ bị nhân đôi).
  pool_context: none               # none | prepend
  # >0 = trộn BM25 caption dày per event vào ma trận sim trước DP:
  # sim += w * minmax-per-event(caption). 0 = tắt; thiếu artifacts tự thành no-op.
  caption_signal_weight: 0.0
  # jitter = giữ nguyên các dòng đầu, phần còn lại của 100 dòng phủ biến thể
  # frame quanh chuỗi tốt nhất mỗi video (keyframe lân cận + trung điểm GIỮA
  # hai keyframe, thiên về sớm) — metric lấy max theo dòng nên dòng thêm là vé số.
  submit_strategy: legacy          # legacy | jitter
  jitter_videos: 4                 # số video top được phủ jitter

extraction:           # K-batch keyframe self-extraction (density = recall knob)
  shot_positions: [0.15, 0.50, 0.85]   # denser (vd [0.1,0.3,0.5,0.7,0.9]) → +recall, +disk/embed time
  dedup_mad_threshold: 6.0             # hạ xuống → giữ nhiều frame gần trùng hơn

ocr:
  engine: easyocr     # easyocr | paddle | none
  langs: [vi, en]
  min_confidence: 0.30

asr:
  model: vinai/PhoWhisper-medium   # -large for best accuracy on H100
  chunk_length_s: 30
  batch_size: 8       # transformers-pipeline chunk batching

caption:
  model: 5CD-AI/Vintern-1B-v3_5
  max_new_tokens: 96
  max_tiles: 6

vqa:
  provider: gemini    # gemini | vintern | none
  gemini_model: gemini-3.7-flash
  # round-41: QA answers ride the strongest callable Pro (thinks longer,
  # own wall cap); chain degrades Pro -> 3.7-flash -> 3.5-flash -> latest.
  answer_model: gemini-3.1-pro-preview
  answer_timeout_s: 90.0
  local_model: 5CD-AI/Vintern-1B-v3_5
  # round-79: "hf_auto" + local_hf_id = fallback local thế hệ Qwen3.5 khi
  # Gemini sập (nạp lười, không tốn VRAM lúc thường); mặc định giữ vintern
  local_backend: vintern
  local_hf_id: ""
  # round-96: chữ OCR của các khung trong strip (±1 keyframe) vào ngữ cảnh QA cùng ASR
  ocr_context: false
  ocr_context_chars: 600
  top_frames: 5
  frames_per_answer: 3      # temporal strip per answer group (1 = single frame)
  answers_per_query: 5      # distinct candidate groups answered in batch mode
  max_calls_per_query: 5
  # ── QA overhaul đợt 2 (mặc định OFF = hành vi cũ nguyên vẹn) ──
  # vote theo LỚP TƯƠNG ĐƯƠNG thay vì chuỗi thô: "2"/"hai"/"02" gộp phiếu,
  # "300 kg"/"300kg"/"ba trăm kg" gộp phiếu (xem cvp/search/answer_norm.py).
  answer_canonicalize: false
  # >0: mỗi nhóm được hỏi thêm N strip LÂN CẬN quanh moment rồi vote chéo toàn
  # bộ phiếu (frame lệch nhẹ vẫn hội tụ về một đáp án). Strip thêm ăn budget
  # max_calls_per_query — bench nên tăng max_calls_per_query (vd 15), nếu cạn
  # budget knob sẽ CẢNH BÁO TO thay vì âm thầm bỏ qua. Chi phí: mỗi strip thêm
  # ≤ self_consistency call Gemini.
  answer_neighbor_frames: 0
  # nhóm ứng viên có phiếu ĐỒNG THUẬN TUYỆT ĐỐI được đẩy khối dòng lên đầu CSV
  # khi nhóm top bất nhất (đáp án top không ổn định thường = moment sai/ảnh mờ).
  consistency_rerank: false
  # round-77: nộp thêm dòng song-định-dạng số↔chữ trên cùng (video, frame) —
  # thế chỗ dòng đuôi, đầu bảng không đổi; bảo hiểm chấm exact-text của BTC
  answer_variant_rows: false
  # round-77: prompt QA yêu cầu chép NGUYÊN VĂN chữ hiển thị (bài học q19:
  # đáp án lệch GT đúng một chữ vì model diễn đạt lại)
  exact_transcription: false
  # round-82: số nhóm QA hỏi Gemini song song (1 = tuần tự như cũ; trận đề xuất 4)
  parallel_calls: 1

submission:
  package_name: submission  # folder name inside the Codabench zip
  dres_base_url: ""         # finals endpoint; credentials via DRES_USER / DRES_PASSWORD
  dres_evaluation_id: ""    # DRES v2 evaluation id (announced at the finals)
  dres_timeout_s: 6.0
  auto_submit: false        # automatic track: submit without human confirmation
  # round-77: quá mốc này (phút; 0 = tắt) run_auto bật chế độ NƯỚC RÚT cho
  # các câu còn lại (QA votes 1, tắt neighbor strips + VLM rerank) — bài học
  # đêm 28/08: bão 504 kéo pack 60'→142' và cổng nộp đóng khi còn 3 câu
  pack_deadline_min: 0.0
  # round-96: thứ tự câu trong pack — "kis_first" = KIS/AVS → TRAKE → QA (bảng
  # public chỉ chấm KIS; QA chậm nhất chịu nước rút trước); "name" = theo tên file
  query_order: name

# round-96: cầu dao bão Gemini (cvp/models/gemini_health.py) — model rớt
# min_consecutive lần liên tiếp (503/504/timeout) → mọi call site bỏ qua nó
# cooldown_s giây rồi thăm dò một cuộc gọi. API khỏe = không đổi gì. nb03 bật.
breaker:
  enabled: false
  window: 8
  fail_ratio: 0.75
  min_consecutive: 3
  cooldown_s: 120.0

logging:
  level: INFO
