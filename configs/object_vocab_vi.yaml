# Vietnamese noun → Open Images class (the organiser's object detections use
# Open Images V4 entities). Longest phrase wins during parsing.
# Extend freely — unknown nouns are simply ignored. Every value on the right
# MUST be a real Open Images V4 class name, otherwise the boost silently
# never fires (there is nothing for it to match in the detection files).
#
# Notes on deliberate approximations (OIV4 has no closer class):
#   - roles (cảnh sát, bác sĩ, ...) → Person
#   - trâu (water buffalo)          → Cattle
#   - lân / múa lân (dance lion)    → Lion
#   - phở / bún / tô (noodle soup)  → Bowl (what the detector actually sees)
#   - chùa / nhà thờ                → Building

