[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvp"
version = "1.0.0"
description = "Core-Vision Perfect V1 — Vietnamese text-to-keyframe interactive + automatic video retrieval for the HCMC AI Challenge 2026 (KIS / KIS-V / QA / TRAKE / AVS / KIS-C)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Core Vision Team" }]

# Core: everything needed for catalog / submission / fusion / tests (no GPU).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "tqdm>=4.66",
    "pillow>=10.2",
    "rank-bm25>=0.2.2",
]

# NOTE: [project.scripts] must come AFTER the plain `dependencies` key — a
# table header would otherwise swallow it (CI-caught setuptools error).
[project.scripts]
cvp = "cvp.cli:main"

[project.optional-dependencies]
# Dense search (CPU laptop / demo).
search = ["faiss-cpu>=1.8"]
# Encoders + training (Colab installs these; see requirements-colab.txt).
# transformers>=4.57: first release with Qwen3-VL classes (qwen_embed lane);
# siglip2 & co. are fine on anything ≥4.51, so the shared floor is safe.
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.57",
    "open_clip_torch>=2.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "peft>=0.11",
    "accelerate>=1.0",
    "datasets>=2.19",   # public VI caption channels (training/public_datasets.py)
]
# Aux pipelines (timm + einops: Vintern-1B trust_remote_code dependencies).
aux = [
    "easyocr>=1.7",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6.4",
    "timm>=1.0",
    "einops>=0.7",
]
# Interactive UI (st.dialog needs 1.37+, use_container_width for images 1.40+).
app = ["streamlit>=1.40"]
# Query understanding / VQA APIs.
llm = ["google-genai>=1.0", "deep-translator>=1.11"]
# Optional M-CLIP ensemble member.
mclip = ["multilingual-clip>=1.0.10"]
# HTTP/JSON retrieval service (machine-callable face for the 2026 automatic track).
service = ["fastapi>=0.111", "uvicorn>=0.30"]
# fastapi+httpx let CI exercise the service endpoints (TestClient) without uvicorn.
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.111", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
